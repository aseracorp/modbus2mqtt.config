      offset: 0
      decimals: 2
      numberFormat: 0
      identification:
        min: 0
        max: 100
      device_class: humidity
      state_class: 1
      uom: "g/m³"
    valid: true
    mqttname: absolute_humidity
    name: Absolute humidity

  - id: 5
