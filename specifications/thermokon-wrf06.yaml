filename: thermokon-wrf06
model: WRF06
manufacturer: Thermokon
version: "0.5"
nextEntityId: 26
entities:
  # ---- Sensor identification register (used as the condition register) ----
  # Register 501 bitmask: bit0=Temp, bit1=rH, bit2=AbsHum, bit3=Enthalpy,
  # bit4=DewPoint, bit5=CO2, bit6=VOC, bit7=CO2VOCMix (1 = sensor present)
  - id: 1
    registerType: 3
    readonly: true
    converter:
      name: number
    modbusAddress: 501
    converterParameters:
      multiplier: 1
      offset: 0
      decimals: 0
      numberFormat: 0
      identification:
        min: 0
        max: 255
    valid: true
    mqttname: sensor_identification
    name: Sensor identification
    entityCategory: diagnostic

  # ---- Value registers (conditional on the sensor-identification bitmask) ----
  - id: 2
    registerType: 3
    readonly: true
    converter:
      name: number
    modbusAddress: 0
    condition:
      register: 400
      comparator: eq
      value: 1
    valueDescription: 'Temperature in °C (SI unit system)'
    converterParameters:
      multiplier: 0.1
      offset: 0
      decimals: 1
      numberFormat: 0
      identification:
        min: -40
        max: 125
      device_class: temperature
      state_class: 1
      uom: "°C"
    valid: true
    mqttname: temperature
    name: Temperature

  - id: 25
    registerType: 3
    readonly: true
    converter:
      name: number
    modbusAddress: 0
    condition:
      register: 400
      comparator: eq
      value: 2
    valueDescription: 'Temperature in °F (Imperial unit system)'
    converterParameters:
      multiplier: 0.1
      offset: 0
      decimals: 1
      numberFormat: 0
      identification:
        min: -40
        max: 257
      device_class: temperature
      state_class: 1
      uom: "°F"
    valid: true
    mqttname: temperature_imperial
    name: Temperature (Imperial)

  - id: 3
    registerType: 3
    readonly: true
    converter:
      name: number
    modbusAddress: 1
    condition:
      register: 501
      bit: 1
      comparator: eq
      value: 1
    valueDescription: 'Relative humidity in %'
    converterParameters:
