filename: thermokon-wrf06
model: WRF06
manufacturer: Thermokon
files:
  - url: specifications/files/thermokon-wrf06/thermokon-wrf06.jpg
    fileLocation: 0
    usage: img
  - url: specifications/files/thermokon-wrf06/Specifikation_WRF06_AQ_FTW06_Modbus_en_Rev_C.pdf
    fileLocation: 0
    usage: doc
version: "0.5"
nextEntityId: 26
entities:
  # ---- Sensor identification register (used as the condition register) ----
  # Register 501 bitmask: bit0=Temp, bit1=rH, bit2=AbsHum, bit3=Enthalpy,
  # bit4=DewPoint, bit5=CO2, bit6=VOC, bit7=CO2VOCMix (1 = sensor present)
  - id: 1
    registerType: 3
    readonly: true
    converter:
      name: number
    modbusAddress: 501
    converterParameters:
      multiplier: 1
      offset: 0
      decimals: 0
      numberFormat: 0
      identification:
        min: 0
        max: 255
    valid: true
    mqttname: sensor_identification
    name: Sensor identification
    entityCategory: diagnostic

  # ---- Value registers (conditional on the sensor-identification bitmask) ----
  - id: 2
    registerType: 3
    readonly: true
    converter:
      name: number
    modbusAddress: 0
    conditions:
      - register: 400
        comparator: eq
        value: 1
      - register: 501
        bit: 0
        comparator: eq
        value: 1
    valueDescription: 'Temperature in °C (SI unit system)'
    converterParameters:
      multiplier: 0.1
      offset: 0
      decimals: 1
      numberFormat: 0
      identification:
        min: -40
        max: 125
      device_class: temperature
      state_class: 1
      uom: "°C"
    valid: true
    mqttname: temperature_si
    name: Temperature

  - id: 25
    registerType: 3
    readonly: true
    converter:
      name: number
    modbusAddress: 0
    conditions:
      - register: 400
        comparator: eq
        value: 2
      - register: 501
        bit: 0
        comparator: eq
        value: 1
    valueDescription: 'Temperature in °F (Imperial unit system)'
    converterParameters:
      multiplier: 0.1
      offset: 0
      decimals: 1
      numberFormat: 0
      identification:
        min: -40
        max: 257
      device_class: temperature
      state_class: 1
      uom: "°F"
    valid: true
    mqttname: temperature_imperial
    name: Temperature

  - id: 3
    registerType: 3
    readonly: true
    converter:
      name: number
    modbusAddress: 1
    condition:
      register: 501
      bit: 1
      comparator: eq
      value: 1
    valueDescription: 'Relative humidity in %'
    converterParameters:
      multiplier: 0.1
      offset: 0
      decimals: 1
      numberFormat: 0
      identification:
        min: 0
        max: 100
      device_class: humidity
      state_class: 1
      uom: "%"
    valid: true
    mqttname: relative_humidity
    name: Relative humidity

  - id: 4
    registerType: 3
    readonly: true
    converter:
      name: number
    modbusAddress: 2
    condition:
      register: 501
      bit: 2
      comparator: eq
      value: 1
    valueDescription: 'Absolute humidity in g/m³'
    converterParameters:
      multiplier: 0.01
      offset: 0
      decimals: 2
      numberFormat: 0
      identification:
        min: 0
        max: 83
      device_class: humidity
      state_class: 1
      uom: "g/m³"
    valid: true
    mqttname: absolute_humidity
    name: Absolute humidity

  - id: 5
    registerType: 3
    readonly: true
    converter:
      name: number
    modbusAddress: 3
    condition:
      register: 501
      bit: 3
      comparator: eq
      value: 1
    valueDescription: 'Enthalpy in kJ/kg'
    converterParameters:
      multiplier: 0.1
      offset: 0
      decimals: 1
      numberFormat: 0
      identification:
        min: 0
        max: 274
      state_class: 1
      uom: "kJ/kg"
    valid: true
    mqttname: enthalpy
    name: Enthalpy

  - id: 6
    registerType: 3
    readonly: true
    converter:
      name: number
    modbusAddress: 4
    condition:
      register: 501
      bit: 4
      comparator: eq
      value: 1
    valueDescription: 'Dew point in °C'
    converterParameters:
      multiplier: 0.1
      offset: 0
      decimals: 1
      numberFormat: 0
      identification:
        min: -110
        max: 50
      device_class: temperature
      state_class: 1
      uom: "°C"
    valid: true
    mqttname: dew_point
    name: Dew point

  - id: 7
    registerType: 3
    readonly: true
    converter:
      name: number
    modbusAddress: 5
    condition:
      register: 501
      bit: 5
      comparator: eq
      value: 1
    valueDescription: 'CO₂ concentration in ppm'
    converterParameters:
      multiplier: 1
      offset: 0
      decimals: 0
      numberFormat: 0
      identification:
        min: 0
        max: 5000
      device_class: carbon_dioxide
      state_class: 1
      uom: "ppm"
    valid: true
    mqttname: co2
    name: CO2

  - id: 8
    registerType: 3
    readonly: true
    converter:
      name: number
    modbusAddress: 6
    condition:
      register: 501
      bit: 6
      comparator: eq
      value: 1
    valueDescription: 'VOC level in %'
    converterParameters:
      multiplier: 0.1
      offset: 0
      decimals: 1
      numberFormat: 0
      identification:
        min: 0
        max: 100
      state_class: 1
      uom: "%"
    valid: true
    mqttname: voc
    name: VOC

  - id: 9
    registerType: 3
    readonly: true
    converter:
      name: number
    modbusAddress: 7
    condition:
      register: 501
      bit: 7
      comparator: eq
      value: 1
    valueDescription: 'CO₂/VOC mix level in %'
    converterParameters:
      multiplier: 0.1
      offset: 0
      decimals: 1
      numberFormat: 0
      identification:
        min: 0
        max: 100
      state_class: 1
      uom: "%"
    valid: true
    mqttname: co2_voc_mix
    name: CO2 VOC Mix

  # ---- Config registers (device configuration - NOT published to MQTT/HA) ----
  - id: 10
    registerType: 3
    readonly: false
    converter:
      name: select
    modbusAddress: 400
    category: config
    converterParameters:
      multiplier: 1
      offset: 0
      decimals: 0
      numberFormat: 0
      options:
        - key: 1
          name: SI
        - key: 2
          name: Imperial
      identification:
        min: 1
        max: 2
    valid: true
    mqttname: unit_system
    name: Unit system

  - id: 11
    registerType: 3
    readonly: false
    converter:
      name: number
    modbusAddress: 100
    category: config
    condition: { register: 501, bit: 0, comparator: eq, value: 1 }
    converterParameters:
      multiplier: 0.1
      offset: 0
      decimals: 1
      numberFormat: 0
      identification:
        min: -40
        max: 125
      uom: "°C"
    valid: true
    mqttname: offset_temperature
    name: Offset temperature

  - id: 12
    registerType: 3
    readonly: false
    converter:
      name: number
    modbusAddress: 101
    category: config
    condition: { register: 501, bit: 1, comparator: eq, value: 1 }
    converterParameters:
      multiplier: 0.1
      offset: 0
      decimals: 1
      numberFormat: 0
      identification:
        min: -100
        max: 100
      uom: "%"
    valid: true
    mqttname: offset_relative_humidity
    name: Offset relative humidity

  - id: 13
    registerType: 3
    readonly: false
    converter:
      name: number
    modbusAddress: 102
    category: config
    condition: { register: 501, bit: 5, comparator: eq, value: 1 }
    converterParameters:
      multiplier: 1
      offset: 0
      decimals: 0
      numberFormat: 0
      identification:
        min: -500
        max: 500
      uom: "ppm"
    valid: true
    mqttname: offset_co2
    name: Offset CO2

  - id: 14
    registerType: 3
    readonly: false
    converter:
      name: number
    modbusAddress: 103
    category: config
    condition: { register: 501, bit: 6, comparator: eq, value: 1 }
    converterParameters:
      multiplier: 1
      offset: 0
      decimals: 0
      numberFormat: 0
      identification:
        min: -100
        max: 100
      uom: "%"
    valid: true
    mqttname: offset_voc
    name: Offset VOC

  - id: 15
    registerType: 3
    readonly: false
    converter:
      name: number
    modbusAddress: 200
    category: config
    condition: { register: 501, bit: 0, comparator: eq, value: 1 }
    converterParameters:
      multiplier: 0.1
      offset: 0
      decimals: 1
      numberFormat: 0
      identification:
        min: -40
        max: 125
      uom: "°C"
    valid: true
    mqttname: temp_lower_limit
    name: Temperature lower limit

  - id: 16
    registerType: 3
    readonly: false
    converter:
      name: number
    modbusAddress: 201
    category: config
    condition: { register: 501, bit: 0, comparator: eq, value: 1 }
    converterParameters:
      multiplier: 0.1
      offset: 0
      decimals: 1
      numberFormat: 0
      identification:
        min: -40
        max: 125
